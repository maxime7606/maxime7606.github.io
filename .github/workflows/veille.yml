name: Veille

on:
  schedule:
    - cron: "0 6 * * *"   # tous les jours à 6h UTC
  workflow_dispatch:       # permet de le lancer à la main

permissions:
  contents: write

jobs:
  veille:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Récupérer les flux RSS
        run: python3 veille.py

      - name: Sauvegarder veille.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add veille.json
          git diff --staged --quiet || git commit -m "Mise à jour de la veille"
          git push
